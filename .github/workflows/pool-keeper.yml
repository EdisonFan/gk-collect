# GitHub Actions runner 上的代理池维护：探活 + 剔除失效 + 补充换血。
# 2026-11-12：由每 2 小时改为每 30 分钟。第三采集通道改为「领一个长期持有、
# 坏了才换」，池的新鲜度直接决定换到手的号质量，所以缩短换血周期。
# 2026-11-13：触发源改为「WorkBuddy 平台定时任务 → workflow_dispatch」。
#   GitHub 对高频 schedule 限流，*/30 实测从未按时下发（实际间隔 6~8 小时），
#   导致池长时间不换血、idle 号耗尽、采集变慢。改由平台定时任务每 30 分钟
#   发一次 dispatch，探活换血仍由本 runner 执行。
#
# 为什么定时任务只发请求、不自己探活（重要）：
#   sandbox_agent 容器无法连通任意免费代理 IP，早期任务每轮探活 100% 硬超时、
#   从未写回过池子；GitHub runner 网络能通（采集 job 已在用代理）。
#   定时任务只发一个 HTTPS 请求到 api.github.com，不做任何代理连通性探测。
#
# 为什么单独写 pool_keeper_run.py 而不复用共享层脚本（重要）：
#   共享层 proxy_refresh.build_variants() 用「直连目标站」做基线，搬到 runner
#   就等于用 GitHub 共享出口 IP 打 api.zjzw.cn，正是要避免的事。本工作流
#   全程只经代理访问目标站，脚本内 _probe 对空 proxy 有硬性断言。
#
# 配额：单轮约 2~3 分钟，每 30 分钟 = 48 轮/天。公开仓 Actions 免费额度
#       充足；单轮仍设 7 分钟超时防止失控。池无变化时不写回、也不触发镜像。
#       冷却检查防止「定时任务 + special-* push 兜底」叠加过频。

name: Pool keeper (proxy refresh on runner)

on:
  workflow_dispatch:            # 主触发源：平台定时任务每 30 分钟发一次；也可手动预热
  # 兜底：结果分支推送也带起本工作流，由下方冷却检查限制为最多每 30 分钟一次。
  push:
    branches:
      - 'special-*'

permissions:
  contents: write               # 写 proxies_cnb.txt
  actions: write                # 显式 dispatch sync-to-cnb.yml

concurrency:
  group: gk-pool-keeper
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 冷却检查（schedule 未下发时兜底，但不过频）
        id: cooldown
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LAST=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow=pool-keeper.yml \
            --status success --limit 1 --json createdAt -q '.[0].createdAt' 2>/dev/null || true)
          if [ -n "$LAST" ] && [ "$LAST" != "null" ]; then
            AGE=$(( $(date +%s) - $(date -u -d "$LAST" +%s) ))
            if [ "$AGE" -lt 1500 ]; then
              echo "距上次成功刷新 ${AGE}s < 1500s，跳过本轮"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: 探活并补充代理池（全程零直连）
        if: steps.cooldown.outputs.skip != 'true'
        id: refresh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUPABASE_URL: https://ripobzmwgmdxyixoevee.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python3 pool_keeper_run.py

      - name: 同步代理池到 Supabase（供第三仓按需领取）
        # 每 30 分钟池换血后 upsert 进 public.proxy_pool：新出口插入、
        # 死号复活、已剔除的旧出口标 dead。sync_proxy_pool 不覆盖在租约中的行。
        if: steps.cooldown.outputs.skip != 'true' && always()
        env:
          SUPABASE_URL: https://ripobzmwgmdxyixoevee.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python3 pool_sync_supabase.py

      - name: 触发 1:1 镜像同步
        if: steps.cooldown.outputs.skip != 'true' && steps.refresh.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GITHUB_TOKEN 产生的 push 不会再触发 workflow（GitHub 防递归规则），
          # 所以池文件变化后显式 dispatch 一次 sync-to-cnb，保证 CNB 侧同步。
          gh workflow run sync-to-cnb.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "已触发 sync-to-cnb"
