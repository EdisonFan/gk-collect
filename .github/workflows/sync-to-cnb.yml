# GitHub  EdisonFan/gk-collect
#   → CNB  cooledi/gk-collect   完整 1:1 镜像（CNB 侧只读）
#
# 设计要点（针对本项目，勿删）：
#   1. CNB_REPO 与 GitHub repo 同名 gk-collect；组名 cooledi ≠ owner EdisonFan，须写死
#   2. 完整 1:1 镜像：main + 全部 plan-* / cutoff-* / special-* / local-share-* 分支，
#      --force --prune 逐 ref 对齐 —— CNB 侧不单独维护内容，GitHub 是唯一真源
#   3. 触发红线（用户明确）：仅 workflow_dispatch 手动派发，不设任何定时触发。
#      采集已全部收官，无需 workflow_run / push 自动兜底。
#   4. 显式 fetch 全部分支再推，避免 checkout 只拉当前分支导致漏推
#   5. branches 入参用于试点：只推指定分支；留空 = 全量 1:1

name: Sync gk-collect to CNB (1:1)

on:
  workflow_dispatch:
    inputs:
      branches:
        description: '逗号分隔分支名(试点)；留空=全量1:1'
        required: false
        type: string
        default: ''

jobs:
  mirror:
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    concurrency:
      group: sync-gk-collect-to-cnb   # 串行推送，避免并发写冲突
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 检查 CNB_TOKEN
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN || secrets.CNB__TOKEN }}
        run: |
          [ -n "$CNB_TOKEN" ] || { echo "::error::未配置 CNB_TOKEN"; exit 1; }
          echo "CNB_TOKEN 已配置"

      - name: 试点——仅推指定分支
        if: ${{ inputs.branches != '' }}
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN || secrets.CNB__TOKEN }}
          BRANCHES: ${{ inputs.branches }}
        run: |
          set -euo pipefail
          git config --global http.postBuffer 524288000
          git remote add cnb "https://cnb:${CNB_TOKEN}@cnb.cool/cooledi/gk-collect.git"
          IFS=',' read -ra ARR <<< "$BRANCHES"
          ok=0; fail=0
          for b in "${ARR[@]}"; do
            b="$(echo "$b" | xargs)"
            [ -z "$b" ] && continue
            echo "=== 试点 $b ==="
            git fetch -q --no-tags origin "refs/heads/$b:refs/remotes/origin/$b" || { echo "拉取失败 $b"; fail=$((fail+1)); continue; }
            git push cnb "refs/remotes/origin/$b:refs/heads/$b" --force && ok=$((ok+1)) || { echo "推送失败 $b"; fail=$((fail+1)); }
          done
          echo "试点完成: ok=$ok fail=$fail"
          [ "$fail" -eq 0 ] || exit 1

      - name: 全量 1:1 镜像
        if: ${{ inputs.branches == '' }}
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN || secrets.CNB__TOKEN }}
        run: |
          set -euo pipefail
          git config --global http.postBuffer 524288000
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          git branch -rd origin/HEAD 2>/dev/null || true
          git remote add cnb "https://cnb:${CNB_TOKEN}@cnb.cool/cooledi/gk-collect.git"
          echo "GitHub 分支数: $(git for-each-ref --format='%(refname:short)' refs/remotes/origin | wc -l)"
          echo "=== 全量 1:1 推送(含 --prune 清理多余分支) ==="
          git push --force --prune cnb '+refs/remotes/origin/*:refs/heads/*'
          echo "=== 完成，最终核验 ==="
          echo "CNB 分支数: $(git ls-remote --heads cnb | wc -l)"
