# GitHub  EdisonFan/gk-collect
#   → CNB  cooledi/gk-data-archive   单向镜像（CNB 侧只读）
#
# 用法：放到 GitHub 仓库的 .github/workflows/sync-to-cnb.yml
#
# 相对通用镜像模板的 4 处适配（针对本项目，勿删）：
#   1. 只镜像 cutoff-* 采集结果分支，**不推 main、不加 --prune**
#      —— CNB 侧 main 是「中文归档目录 + MD 文档」，被 --force --prune 会覆盖/剪掉
#   2. CNB 组名 cooledi ≠ GitHub owner EdisonFan，CNB_REPO 必须写死
#   3. 显式 fetch 全部 cutoff-* 分支再推，避免 checkout 只拉当前分支导致漏推
#   4. 触发方式用 workflow_run：采集器 collect.yml 用默认 GITHUB_TOKEN 推送
#      cutoff-* 分支，而 GitHub 规定 GITHUB_TOKEN 产生的 push 不会再触发
#      workflow（防递归），故 on.push 对本项目实际不生效。改由 gk-cutoff
#      run 完成时触发；一次采集 run 只同步一次全量分支，比逐分支 push 更省。
#
# 启用前置（一次性）：GitHub → Settings → Secrets and variables → Actions
#   → New repository secret，名称 CNB_TOKEN，值填 CNB 访问令牌
#   （Git 用户名固定 cnb，CNB 只支持 HTTPS + 令牌，不支持 SSH）
#   若误建成 CNB__TOKEN（双下划线）也会自动兼容

name: Sync cutoff branches to CNB

on:
  # 实际生效的自动触发：采集流水线完成后同步（不受 GITHUB_TOKEN 防递归影响）
  workflow_run:
    workflows: ['gk-cutoff']
    types: [completed]
  push:
    branches: ['cutoff-*']   # 保留：若将来改用 PAT 推分支则自动生效
  workflow_dispatch:         # 手动补一次同步

jobs:
  mirror:
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: sync-cutoff-to-cnb   # 所有 cutoff 分支串行推送，避免并发写冲突
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push cutoff branches to CNB
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN || secrets.CNB__TOKEN }}
          CNB_REPO: cooledi/gk-data-archive
        run: |
          set -euo pipefail
          if [ -z "${CNB_TOKEN}" ]; then
            echo "::error::未配置 CNB_TOKEN，请在 Settings → Secrets and variables → Actions 添加"
            exit 1
          fi
          git config --global http.postBuffer 524288000
          git fetch --no-tags origin '+refs/heads/cutoff-*:refs/remotes/origin/cutoff-*'
          git remote add cnb "https://cnb:${CNB_TOKEN}@cnb.cool/${CNB_REPO}.git"
          # 只推 cutoff-* 分支；CNB 侧 main（中文归档）与其它分支保持不动
          git push --force cnb '+refs/remotes/origin/cutoff-*:refs/heads/cutoff-*'
