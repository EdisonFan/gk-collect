# 从新仓库 edge-cache-lab 回收专业录取线结果到主仓库（1:1 转运）。
#
# 为什么要单独一个工作流（2026-11-12 实测）：
#   新仓库只负责「执行」，但全局达标统计、CNB 镜像、cloud_feed 的 gate_ok
#   全部基于主仓库的 special-* 分支。结果不回主仓库，这批组合永远显示未达标。
#
# 为什么不让沙箱本地搬运（实测走不通）：
#   结果文件 20~30MB。沙箱出口对单次大响应会截断：
#     - GitHub blob API 整块 GET 每次在 7~17MB 处 IncompleteRead，重试 3 次同样断；
#     - GitHub blob 端点忽略 Range 头（返回 422），无法分块；
#     - raw.githubusercontent 与 git fetch 同样被截断/连不上 443。
#   但 GitHub Actions runner 网络通畅且稳定，所以把「搬运」这件事交给 runner。
#
# 搬运方式：runner 上 git fetch 新仓库的 special-* 分支，再推到主仓库同名分支。
#   - 保留新仓库结果文件原样（不重新序列化，避免内容漂移）
#   - commit 首行带 gate_pass=True，让 cloud_feed.gate_ok 能认
#   - 主仓库已有 gate_pass=True 的结果时跳过，避免用未达标结果覆盖已达标结果
#
# 触发：schedule 每 10 分钟 + workflow_dispatch（手动补一轮）

name: Sync lab results back to gk-collect

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  # 实测（2026-11-12）：本仓库所有 schedule 事件都未被 GitHub 下发，
  # 不能依赖定时。改由主仓自身的高频事件驱动，纯 GitHub 侧闭环，
  # 不再依赖会被沙箱回收的本地 lab_transport.sh 守护。
  #  - 本地/云端用 PAT 推 special-* 结果分支 -> push
  #  - push 触发的 CNB 镜像同步跑完 -> workflow_run
  # 循环自限：转运推分支用 GITHUB_TOKEN（不触发 push/workflow_run），
  # 且只在有新达标结果时显式派发一次 CNB 同步；下一轮转运发现已达标
  # 即 SYNCED=0，不再派发，链条终止。
  push:
    branches:
      - 'special-*'
  workflow_run:
    workflows: ["Sync gk-collect to CNB (1:1)"]
    types: [completed]

permissions:
  contents: write
  actions: write        # gh workflow run / dispatches 需要；缺了会 403（11-13 实测）

concurrency:
  group: gk-lab-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 从 edge-cache-lab 拉取结果分支并推回主仓库
        env:
          LAB_REPO: EdisonFan/edge-cache-lab
          # gh CLI 只认 GH_TOKEN；只给 GITHUB_TOKEN 时 gh workflow run 会静默失败
          # （2026-11-12 实测：日志「触发镜像同步失败」，但转运本身成功）。
          # 注意：不要在这里显式设 GITHUB_TOKEN，Actions 已自动注入该变量，
          # 手写覆盖反而可能让它失效。
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.email "gk-collect@users.noreply.github.com"
          git config user.name "gk-collect"

          # 显式 fetch 两个执行仓的结果分支（浅克隆不带其它 remote）。
          # 第二仓 edge-cache-lab 与第三仓 edge-relay-probe 都只推自己仓，
          # 由本工作流统一回收到主仓；谁先达标谁进，已达标不覆盖。
          for spec in "lab:EdisonFan/edge-cache-lab" "lab2:EdisonFan/edge-relay-probe"; do
            NAME="${spec%%:*}"
            SRC="${spec#*:}"
            git remote add "$NAME" "https://x-access-token:${GH_TOKEN}@github.com/${SRC}.git" 2>/dev/null \
              || git remote set-url "$NAME" "https://x-access-token:${GH_TOKEN}@github.com/${SRC}.git"
            # 某个执行仓还没产出 special-* 分支时 fetch 会返回 1，
            # 这不是错误：不该让整趟转运失败（2026-11-12 实测踩过）。
            git fetch --no-tags --depth=1 "$NAME" "+refs/heads/special-*:refs/remotes/${NAME}/special-*" \
              || echo "  $NAME 暂无 special-* 结果分支，跳过本源"
          done
          echo "已拉取分支："
          git for-each-ref --format='%(refname:short)' refs/remotes/lab/ refs/remotes/lab2/ | sed 's/^/  /'

          SYNCED=0
          SKIPPED=0
          # 用全名 refs/remotes/lab/<branch> 避免歧义：
          # 本地分支名 special-XX 与远端引用 lab/special-XX 前缀相同，
          # git 会报 "refname is ambiguous" 并解析到错误对象。
          for ref in $(git for-each-ref --format='%(refname)' refs/remotes/lab/special-* refs/remotes/lab2/special-*); do
            BR="${ref##*/}"
            SRC_NAME="${ref#refs/remotes/}"
            SRC_NAME="${SRC_NAME%%/*}"
            F=$(git ls-tree -r --name-only "$ref" | grep -E '^out/special_[0-9]+_[0-9]+\.json$' | head -1 || true)
            if [ -z "$F" ]; then
              echo "跳过 $BR：没有结果文件"
              continue
            fi
            # 主仓库已有 gate_pass=True 的结果就不覆盖（防止降级）。
            # 2026-11-13 修：runner 上 checkout 只拉 main，refs/heads/$BR
            # 根本不存在，旧写法 git rev-parse 恒判 false，导致 14:15
            # 把 10 个已达标分支重复转运了一遍。改为查远程分支的
            # commit message（一次轻量 API，不下载 40MB 结果文件）。
            OLD=$(curl -sS --max-time 30 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/branches/${BR}" \
              | python3 -c "import sys,json; d=json.load(sys.stdin); m=(d.get('commit',{}).get('commit',{}).get('message') or '').splitlines(); print(m[0] if m else '')" 2>/dev/null || echo '')
            case "$OLD" in
              *gate_pass=True*)
                echo "跳过 $BR：主仓库已有达标结果"
                SKIPPED=$((SKIPPED+1))
                continue
                ;;
            esac
            CNT=$(git show "$ref:$F" | python3 -c "import json,sys;d=json.load(sys.stdin);print(d.get('count',0))" 2>/dev/null || echo 0)
            GP=$(git show "$ref:$F" | python3 -c "import json,sys;d=json.load(sys.stdin);print(d.get('gate_pass',False))" 2>/dev/null || echo False)
            if [ "$GP" != "True" ]; then
              echo "跳过 $BR：gate_pass 非 True（$GP）"
              SKIPPED=$((SKIPPED+1))
              continue
            fi
            # 只取结果文件本身，不 checkout 新仓库整棵树。
            # 之前 checkout -B "$BR" "$ref" 会把新仓库的文件树带进主仓库分支
            # （删除 main 独有文件），且浅克隆缺对象导致
            # "remote unpack failed: index-pack failed"。
            # 改为：从 main 起一个干净分支，只 add 结果文件。
            git checkout -B "$BR" main
            git rm -r --cached . >/dev/null 2>&1 || true
            git checkout main -- . 2>/dev/null || true
            git reset >/dev/null
            mkdir -p "$(dirname "$F")"
            git show "$ref:$F" > "$F"
            git add -f "$F"
            git commit -m "special ${BR#special-} gate_pass=True（由 ${SRC_NAME} 转运，${CNT} 条）"
            git push -f origin "HEAD:refs/heads/$BR"
            echo "已转运 $BR count=$CNT"
            SYNCED=$((SYNCED+1))
            git checkout main
          done
          echo "转运完成：$SYNCED 个，跳过 $SKIPPED 个"

          # 转运会推分支，但 GITHUB_TOKEN 推的分支不触发 workflow_run，
          # 也因 GitHub 防递归规则不触发 on.push，所以这里显式补一次镜像同步。
          # 注意 gh CLI 读的是 GH_TOKEN，只给 GITHUB_TOKEN 会静默失败
          # （2026-11-12 实测：日志显示「触发镜像同步失败」）。
          # 2026-11-13 修：GITHUB_TOKEN 缺 actions: write 时 gh/API 都返回
          # 403 "Resource not accessible by integration"；旧兜底 curl 没加 -f，
          # 403 也被当成成功打印「API 派发镜像同步成功」，实际没产生 run。
          # 现在按 HTTP 状态码判定，失败用 ::error:: 明确报出。
          if [ "$SYNCED" -gt 0 ]; then
            TRIGGERED=0
            if gh workflow run sync-to-cnb.yml --repo "$GITHUB_REPOSITORY" --ref main; then
              echo "已触发 sync-to-cnb 镜像同步（gh）"
              TRIGGERED=1
            else
              echo "::warning::gh 触发失败，改用 API 直接派发"
              CODE=$(curl -sS --max-time 40 -o /tmp/dispatch_resp.json \
                -w '%{http_code}' -X POST \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "Content-Type: application/json" \
                -d '{"ref":"main"}' \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/sync-to-cnb.yml/dispatches" || echo 000)
              if [ "$CODE" = "204" ] || [ "$CODE" = "200" ]; then
                echo "API 派发镜像同步成功 HTTP $CODE"
                TRIGGERED=1
              else
                echo "::error::API 派发镜像同步失败 HTTP $CODE: $(head -c 300 /tmp/dispatch_resp.json 2>/dev/null)"
              fi
            fi
            [ "$TRIGGERED" = "1" ] || echo "::error::本轮转运未触发镜像同步，CNB 可能滞后，需手动补一轮"
          fi
