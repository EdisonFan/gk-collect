# GitHub  EdisonFan/gk-collect
#   → CNB  cooledi/gk-collect   完整 1:1 镜像（CNB 侧只读）
#
# 用法：放到 GitHub 仓库的 .github/workflows/sync-to-cnb.yml
#
# 设计要点（针对本项目，勿删）：
#   1. CNB_REPO 与 GitHub repo 同名 gk-collect；组名 cooledi ≠ owner EdisonFan，须写死
#   2. 完整镜像：main + 全部 cutoff-* / special-* 分支，--force --prune 保持逐 ref 一致
#      —— CNB 侧不单独维护内容，GitHub 是唯一真源
#   3. 触发双通道：云端采集器用默认 GITHUB_TOKEN 推分支，GitHub 防递归规则
#      不会触发 workflow，故由采集 run 完成时用 workflow_run 触发；
#      本地采集器用 PAT 推结果分支会触发 push，故 on.push 必须覆盖结果分支，
#      否则本地推的 special-* 只停在 GitHub、进不了 CNB
#      （2026-11-11 实测 special-64-2025 缺 15 分钟未被同步，L4 抓到）
#   4. 显式 fetch 全部分支再推，避免 checkout 只拉当前分支导致漏推
#   5. main 变更（归档/代码更新）与结果分支推送均由 on.push 直接触发镜像

name: Sync gk-collect to CNB (1:1)

on:
  workflow_run:
    workflows: ['gk-cutoff', 'gk-special']
    types: [completed]
  push:
    branches: ['main', 'cutoff-*', 'special-*']
  workflow_dispatch:         # 手动补一次同步

jobs:
  mirror:
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: sync-gk-collect-to-cnb   # 串行推送，避免并发写冲突
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Full mirror to CNB
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN || secrets.CNB__TOKEN }}
          CNB_REPO: cooledi/gk-collect
        run: |
          set -euo pipefail
          if [ -z "${CNB_TOKEN}" ]; then
            echo "::error::未配置 CNB_TOKEN，请在 Settings → Secrets and variables → Actions 添加"
            exit 1
          fi
          git config --global http.postBuffer 524288000
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          git remote add cnb "https://cnb:${CNB_TOKEN}@cnb.cool/${CNB_REPO}.git"
          # 完整镜像 main + 全部结果分支（投档线 cutoff-* / 专业线 special-*）
          # --prune 清掉 CNB 上源站已删的分支
          git push --force --prune cnb \
            '+refs/remotes/origin/main:refs/heads/main' \
            '+refs/remotes/origin/cutoff-*:refs/heads/cutoff-*' \
            '+refs/remotes/origin/special-*:refs/heads/special-*'
